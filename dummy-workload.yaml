apiVersion: apps/v1
kind: Deployment
metadata:
  name: ts-train-service
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ts-train-service
  template:
    metadata:
      labels:
        app: ts-train-service
    spec:
      containers:
      - name: ts-train-service
        image: nginx:alpine
        resources:
          requests:
            memory: "16Mi"
            cpu: "10m"
          limits:
            memory: "64Mi"
            cpu: "100m"
---
apiVersion: v1
kind: Service
metadata:
  name: ts-train-service
  namespace: default
spec:
  ports:
  - port: 8080
    targetPort: 80
  selector:
    app: ts-train-service
---
